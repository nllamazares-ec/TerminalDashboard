<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>replica · perfil</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0d0f12; --win: #111418; --bar: #161a1f; --line: #23282f; --line-soft: #1a1e24; --tile: #14181d;
    --fg: #d4d8de; --mid: #9aa3ad; --dim: #7d858f; --acc: #8fd3a8; --acc-soft: rgba(143, 211, 168, .09); --warn: #e0a96d;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: radial-gradient(1200px 600px at 50% -10%, #151a20 0%, var(--bg) 60%) fixed, var(--bg); }
  body {
    color: var(--fg); font: 400 13.5px/1.6 "JetBrains Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
    padding: clamp(16px, 4vw, 48px) clamp(10px, 3vw, 32px); min-height: 100vh; -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--acc); color: var(--bg); }
  a { color: inherit; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; }
  button:focus-visible, a:focus-visible { outline: 1px solid var(--acc); outline-offset: 2px; }

  .window { width: 100%; max-width: 1100px; margin: 0 auto; background: var(--win); border: 1px solid var(--line); border-radius: 10px; box-shadow: 0 30px 80px -30px rgba(0,0,0,.7), 0 0 0 1px rgba(255,255,255,.02) inset; overflow: hidden; }
  .titlebar { display: flex; align-items: center; gap: 14px; padding: 10px 14px; background: var(--bar); border-bottom: 1px solid var(--line); color: var(--dim); font-size: 12px; }
  .dots { display: flex; gap: 7px; } .dots i { width: 10px; height: 10px; border-radius: 50%; background: #2a3038; }
  .titlebar .t { flex: 1; text-align: center; margin-right: 44px; }
  .content { padding: clamp(18px, 3vw, 30px); display: flex; flex-direction: column; gap: 34px; }

  .prompt { color: var(--mid); } .prompt .u { color: var(--acc); } .prompt .p { color: var(--dim); }
  .cursor { display: inline-block; width: 7px; height: 1.1em; vertical-align: -2px; background: var(--acc); opacity: .8; animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .back { color: var(--dim); text-decoration: none; font-size: 12px; } .back:hover { color: var(--acc); }
  h1 { font-weight: 500; font-size: 22px; letter-spacing: -.01em; margin: 14px 0 4px; } h1 em { font-style: normal; color: var(--acc); }
  .meta { display: flex; flex-wrap: wrap; gap: 4px 22px; color: var(--dim); font-size: 12px; } .meta b { color: var(--mid); font-weight: 500; }
  h2 { display: flex; align-items: center; gap: 10px; font-weight: 400; font-size: 11.5px; color: var(--dim); margin-bottom: 12px; }
  h2::after { content: ""; flex: 1; height: 1px; background: var(--line); order: 1; } h2 span:last-child { order: 2; }
  .muted { color: var(--dim); } .flag { color: var(--warn); }

  .hero { display: grid; grid-template-columns: minmax(0, 1fr) 300px; gap: 32px; align-items: stretch; }
  @media (max-width: 820px) { .hero { grid-template-columns: minmax(0, 1fr); } }
  .stage { position: relative; display: grid; place-items: end center; min-height: 300px; padding: 28px 16px 18px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); overflow: hidden; }
  .stage::after { content: ""; position: absolute; left: 12%; right: 12%; bottom: 16px; height: 6px; border-radius: 50%; background: rgba(0,0,0,.45); }
  .stage .avt { z-index: 1; }
  .stage .cap { position: absolute; left: 12px; top: 8px; font-size: 11.5px; color: var(--dim); }
  .stats { display: flex; flex-direction: column; }
  .stat { display: flex; justify-content: space-between; gap: 10px; padding: 6px 0; border-bottom: 1px solid var(--line-soft); }
  .stat .v { color: var(--fg); font-variant-numeric: tabular-nums; display: inline-flex; align-items: center; gap: 6px; }
  .stat.hi .v { color: var(--acc); }
  .big { font-size: 30px; font-weight: 300; letter-spacing: -.02em; line-height: 1.2; }

  .cards { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 10px; }
  .card { display: flex; flex-direction: column; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; text-align: left; transition: border-color .15s; }
  .card:hover { border-color: #333a43; }
  .card[aria-pressed="true"] { border-color: var(--acc); }
  .card .pic { display: grid; place-items: end center; height: 156px; padding: 10px 6px 8px; background: var(--tile); overflow: hidden; }
  .card .lbl { padding: 6px 10px; font-size: 12px; color: var(--mid); display: flex; justify-content: space-between; gap: 6px; }
  .card[aria-pressed="true"] .lbl { color: var(--acc); }
  .card .lbl small { color: var(--dim); font-size: 11px; }
  /* medallero */
  .medallero { display: grid; grid-template-columns: repeat(auto-fill, minmax(210px, 1fr)); gap: 10px; }
  .med { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--tile); }
  .med .medalla { flex: none; image-rendering: pixelated; line-height: 0; }
  .med.bloq { opacity: .6; }
  .med.bloq .medalla { filter: grayscale(1); opacity: .5; }
  .med b { display: block; font-weight: 500; color: var(--fg); font-size: 12.5px; }
  .med.bloq b { color: var(--mid); }
  .med small { display: block; color: var(--dim); font-size: 11px; line-height: 1.4; }
  .med .veces { margin-left: auto; color: var(--acc); font-size: 12px; font-variant-numeric: tabular-nums; }

  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
  th { text-align: left; font-weight: 400; font-size: 11.5px; color: var(--dim); padding: 0 10px 10px; white-space: nowrap; border-bottom: 1px solid var(--line); }
  td { padding: 8px 10px; border-bottom: 1px solid var(--line-soft); white-space: nowrap; }
  th.num, td.num { text-align: right; }
  td.won { color: var(--acc); }
  .others { display: flex; flex-wrap: wrap; gap: 10px; }
  .others a { display: flex; align-items: center; gap: 8px; padding: 4px 10px 4px 4px; border: 1px solid var(--line); border-radius: 6px; text-decoration: none; color: var(--mid); }
  .others a:hover { color: var(--acc); border-color: var(--acc); }
  .err { display: none; padding: 10px 12px; border: 1px solid #5a3a2a; border-radius: 6px; color: var(--warn); background: rgba(224,169,109,.05); white-space: pre-wrap; }
  footer { display: flex; flex-wrap: wrap; justify-content: space-between; gap: 8px; padding-top: 14px; border-top: 1px solid var(--line); color: var(--dim); font-size: 11.5px; }

  /* personajes */
  .avt { position: relative; display: inline-block; flex: none; }
  .avt img, .avt svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
  .avt img, .avt .spr, .podio-svg image { filter: drop-shadow(0 0 1px rgba(214, 219, 226, .55)); image-rendering: pixelated; }
  .avt .spr { position: absolute; left: 0; top: 0; display: block; background-repeat: no-repeat; }
  /* respiración de las poses quietas */
  .avt-pj.quieto { transform-origin: 50% 100%; animation: respira 2.6s step-end infinite; }
  @keyframes respira { 0% { transform: none } 50% { transform: scaleY(.98) } }
  .avt-pj { position: absolute; left: 0; top: 0; }
  .avt img.mascota { image-rendering: pixelated; animation: hop 1.8s steps(2) infinite; }
  @keyframes hop { 50% { transform: translateY(-8%); } }
  .avt-busto { overflow: hidden; background: #14181d; border: 1px solid var(--line); border-radius: 4px; }
  .avt-busto img, .avt-busto svg { width: auto; height: auto; }
  .avt g { transform-box: fill-box; }
  .star, .bolt, .bulb { animation: tw 1.4s steps(2) infinite; }
  @keyframes tw { 50% { opacity: .35; } }
  .racha { display: inline-flex; align-items: center; gap: 3px; }
  .racha svg, .ico { display: inline-block; vertical-align: -2px; }
  .racha.r1, .racha.r2 { color: #ff9f5a; } .racha.r3 { color: #6fb0ff; } .racha.r4 { color: #b994ff; }
  @media (prefers-reduced-motion: reduce) { .avt *, .cursor { animation: none !important; } }
</style>
</head>
<body>
<div class="window">
  <div class="titlebar"><div class="dots"><i></i><i></i><i></i></div><div class="t">replica — perfil</div></div>
  <div class="content">
    <header>
      <a class="back" href="index.html">‹ volver al tablero</a>
      <div class="prompt" style="margin-top:10px"><span class="u">dev@replica</span><span class="p">:~$</span> sync-migrations --perfil <span id="flag-name"></span> <span class="cursor"></span></div>
      <h1 id="title">—</h1>
      <div class="meta" id="meta"></div>
    </header>

    <div class="err" id="err"></div>

    <section class="hero">
      <div class="stage" id="stage"><span class="cap" id="stage-cap"></span></div>
      <div class="stats" id="stats"></div>
    </section>

    <section>
      <h2><span>animaciones</span><span id="anim-count"></span></h2>
      <div class="cards" id="cards"></div>
    </section>

    <section>
      <h2><span>medallas</span><span id="med-count"></span></h2>
      <div class="medallero" id="medallero"></div>
    </section>

    <section>
      <h2><span>últimas partidas</span><span>10 más recientes</span></h2>
      <div class="scroll"><table id="games"></table></div>
    </section>

    <section>
      <h2><span>otros jugadores</span><span></span></h2>
      <div class="others" id="others"></div>
    </section>

    <footer><div>las animaciones están en avatars/sprites/&lt;personaje&gt;/</div><div><a class="back" href="index.html">tablero</a></div></footer>
  </div>
</div>

<script src="avatars/engine.js?v=4"></script>
<script src="avatars/players.js?v=4"></script>
<script src="avatars/logros.js?v=4"></script>
<script src="config.js"></script>
<script>
const { SUPABASE_URL, SUPABASE_KEY, TZ } = window.CONFIG;
const AV = window.Avatares;
const MONTHS = ["ene", "feb", "mar", "abr", "may", "jun", "jul", "ago", "sep", "oct", "nov", "dic"];
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));
const n = v => v.toLocaleString("es-AR");
const mmss = s => `${String(Math.floor(s / 60)).padStart(2, "0")}:${String(s % 60).padStart(2, "0")}`;
const shortDate = s => { const d = new Date(s + "T00:00:00Z"); return `${d.getUTCDate()} ${MONTHS[d.getUTCMonth()]}`; };
const todayAR = () => new Intl.DateTimeFormat("en-CA", { timeZone: TZ }).format(new Date());
const nombre = new URLSearchParams(location.search).get("n") || "";
let elegido = null;

async function api(view, query = "") {
  const r = await fetch(`${SUPABASE_URL}/rest/v1/${view}?select=*${query}`, { headers: { apikey: SUPABASE_KEY } });
  if (!r.ok) throw new Error(`HTTP ${r.status} en ${view}`);
  return r.json();
}

// mismas reglas que el tablero: "días de juego" = fechas en que jugó alguien
function stats(scores) {
  const t = todayAR();
  const byDay = new Map();
  for (const s of scores) { if (!byDay.has(s.play_date)) byDay.set(s.play_date, []); byDay.get(s.play_date).push(s); }
  const days = [...byDay.keys()].filter(d => d <= t).sort();
  const winners = new Map([...byDay].map(([d, ss]) => { const m = Math.max(...ss.map(s => s.score)); return [d, new Set(ss.filter(s => s.score === m).map(s => s.name))]; }));
  const place = (d, name) => { const ss = byDay.get(d).slice().sort((a, b) => b.score - a.score); return 1 + ss.findIndex(s => s.name === name); };
  const mine = scores.filter(s => s.name === nombre).sort((a, b) => a.play_date < b.play_date ? 1 : -1);
  const back = days.slice().reverse();
  let i = back[0] === t && !winners.get(t)?.has(nombre) ? 1 : 0, racha = 0;
  for (; i < back.length && winners.get(back[i])?.has(nombre); i++) racha++;
  let maxRacha = 0, cur = 0;
  for (const d of days) { if (winners.get(d).has(nombre)) maxRacha = Math.max(maxRacha, ++cur); else cur = 0; }
  const ganados = days.filter(d => winners.get(d).has(nombre)).length;
  const total = mine.reduce((a, s) => a + s.score, 0);
  const best = mine.slice().sort((a, b) => b.score - a.score)[0];
  const perfect = mine.filter(s => s.ok === s.total);
  const fastest = perfect.slice().sort((a, b) => a.elapsed - b.elapsed)[0];
  const record = Math.max(0, ...scores.map(s => s.score));
  return { mine, ganados, racha, maxRacha, total, best, perfect, fastest, esRecord: best && best.score === record, place, winners };
}

function renderAvatarArea(st) {
  const anims = AV.animaciones(nombre);
  const items = [
    // las animaciones muy anchas (ej. una caída larga) se achican para entrar en la tarjeta
    ...anims.map(a => ({ key: "anim:" + a.nombre, titulo: a.titulo, tipo: "animación", ancho: a.ancho, html: alto => AV.avatar(nombre, {}, { anim: a.nombre, alto }) })),
    ...AV.posesDe(nombre).map(p => ({ key: "pose:" + p, titulo: p, tipo: "pose", html: alto => AV.avatar(nombre, {}, { pose: p, alto }) })),
  ];
  if (!elegido || !items.some(i => i.key === elegido)) elegido = items[0].key;
  const cur = items.find(i => i.key === elegido);
  $("stage").innerHTML = `<span class="cap">${esc(cur.titulo)}</span>` + cur.html(190);
  $("cards").innerHTML = items.map(i => `<button class="card" data-k="${esc(i.key)}" aria-pressed="${i.key === elegido}"><span class="pic">${i.html(i.ancho ? Math.min(96, Math.floor(132 / i.ancho)) : 96)}</span><span class="lbl">${esc(i.titulo)}<small>${i.tipo}</small></span></button>`).join("");
  const np = AV.posesDe(nombre).length;
  $("anim-count").textContent = anims.length ? `${anims.length} animaciones · ${np} poses` : `${np} poses · este personaje todavía no tiene animaciones`;
}

function render(scores, players) {
  $("title").innerHTML = `perfil de <em>${esc(nombre)}</em>`;
  $("flag-name").textContent = nombre;
  document.title = `replica · ${nombre}`;
  const st = stats(scores);
  const prom = st.mine.length ? Math.round(st.total / st.mine.length) : 0;
  $("meta").innerHTML = `<div>personaje <b>${esc(AV.spriteDe(nombre) || "—")}</b></div><div>partidas <b>${st.mine.length}</b></div><div>primera <b>${st.mine.length ? shortDate(st.mine[st.mine.length - 1].play_date) : "—"}</b></div>`;
  renderAvatarArea(st);

  const row = (k, v, hi) => `<div class="stat${hi ? " hi" : ""}"><span class="muted">${k}</span><span class="v">${v}</span></div>`;
  $("stats").innerHTML =
    `<div class="muted">puntos totales</div><div class="big">${n(st.total)}</div>` +
    row("promedio", st.mine.length ? n(prom) : "—") +
    row("mejor puntaje", st.best ? `${n(st.best.score)} <span class="muted">${shortDate(st.best.play_date)}</span>${st.esRecord ? " " + AV.iconoSVG("trofeo", 14) : ""}` : "—", st.esRecord) +
    row("días ganados", st.ganados, st.ganados > 0) +
    row("racha de victorias", st.racha ? (AV.rachaSVG(st.racha, 16) || st.racha) : "—") +
    row("mejor racha", st.maxRacha || "—") +
    row("crucigramas 100%", st.perfect.length) +
    row("más rápido 100%", st.fastest ? mmss(st.fastest.elapsed) : "—");

  // medallero: todas las medallas, las ganadas a color (con cuántas veces y desde cuándo) y el resto en gris
  const LG = Logros.calcular(scores, todayAR(), players), mias = LG.de[nombre] || {};
  $("med-count").textContent = `${Object.keys(mias).length} de ${Logros.DEFS.length}`;
  $("medallero").innerHTML = Logros.DEFS.map(d => {
    const r = mias[d.id];
    return `<div class="med${r ? "" : " bloq"}">${Logros.medalla(d.id, 32, !r)}<div><b>${esc(d.nombre)}</b><small>${r ? `${d.nivel} · desde ${shortDate(r.primera)}` : esc(d.desc)}</small></div>${r && r.veces > 1 ? `<span class="veces">×${r.veces}</span>` : ""}</div>`;
  }).join("");

  $("games").innerHTML = `<thead><tr><th>fecha</th><th class="num">pts</th><th class="num">palabras</th><th class="num">tiempo</th><th class="num">puesto</th></tr></thead><tbody>` +
    (st.mine.slice(0, 10).map(s => {
      const p = st.place(s.play_date, nombre);
      return `<tr><td>${shortDate(s.play_date)}${s.daily_seen ? ' <span class="flag">*</span>' : ""}</td><td class="num${p === 1 ? " won" : ""}">${n(s.score)}</td><td class="num">${s.ok}/${s.total}</td><td class="num">${mmss(s.elapsed)}</td><td class="num${p === 1 ? " won" : ""}">${p}.º</td></tr>`;
    }).join("") || `<tr><td colspan="5" class="muted">todavía no jugó</td></tr>`) + "</tbody>";

  $("others").innerHTML = players.filter(p => p !== nombre).map(p =>
    `<a href="perfil.html?n=${encodeURIComponent(p)}">${AV.avatar(p, {}, { recorte: "busto", alto: 32 })}${esc(p)}</a>`).join("");
}

$("cards").addEventListener("click", e => {
  const b = e.target.closest("[data-k]"); if (!b) return;
  elegido = b.dataset.k;
  renderAvatarArea();
  $("stage").scrollIntoView({ behavior: "smooth", block: "nearest" });
});

(async () => {
  try {
    if (!nombre) throw new Error("Falta el jugador en la dirección: perfil.html?n=Nombre");
    const [scores, pl] = await Promise.all([api("public_scores", "&order=play_date.asc"), api("public_players")]);
    const players = pl.map(p => p.name);
    if (!players.includes(nombre) && !scores.some(s => s.name === nombre)) throw new Error(`No hay ningún jugador llamado "${nombre}".`);
    await Promise.all([AV.cargar([...players, nombre].map(AV.spriteDe)), Logros.cargar()]);
    render(scores, players);
  } catch (e) {
    $("err").textContent = "error: " + e.message; $("err").style.display = "block";
  }
})();
</script>
</body>
</html>
